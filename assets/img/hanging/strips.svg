<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 216" width="864" height="216" role="img" aria-labelledby="t d">
  <title id="t">Hanging with adhesive strips</title>
  <desc id="d">Four steps: clean the wall, press the strips and sign flat to the wall, wait an hour, hang and done.</desc>
  <!-- WS IMG. Illustration, drafting style. Animation hooks: paths with class "draw" carry pathLength="1"
       (animate stroke-dasharray:1; stroke-dashoffset 1 -> 0); groups with class "step" / "drop" / "slide" /
       "glow" are the moving parts. Ids starting "slot-" are filled by script (P1b) with the visitor's design.
       Each step: <g class="step" data-step="N">, 200x200 at x = 8 + (N-1)*216; captions come from copy (ix.json). -->
  <style>
    .ink{fill:none;stroke:var(--paper-ink,#180E1F);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .thin{fill:none;stroke:var(--paper-ink,#180E1F);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .draft{fill:none;stroke:var(--draft,#2F5D8A);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .dim{fill:none;stroke:var(--draft,#2F5D8A);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
    .hair{fill:none;stroke:var(--rule,#CFC3B9);stroke-width:1.1;stroke-linecap:round}
    .dash{fill:none;stroke:var(--draft,#2F5D8A);stroke-width:1.2;stroke-dasharray:3 5;stroke-linecap:round}
    .hatch{fill:none;stroke:var(--paper-soft,#5A4F5C);stroke-width:1;stroke-linecap:round;opacity:.55}
    .acrylic{fill:var(--draft-faint,rgba(47,93,138,.14));stroke:var(--draft,#2F5D8A);stroke-width:1.5;stroke-linejoin:round}
    .tube{fill:none;stroke:var(--room,#C8A04A);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .tube-off{fill:none;stroke:var(--paper-soft,#5A4F5C);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
    .glow{fill:none;stroke:var(--room,#C8A04A);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;opacity:.22}
    .cable{fill:none;stroke:var(--paper-soft,#5A4F5C);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tint{fill:var(--paper-2,#E9DFD3)}
    .paperfill{fill:var(--paper,#F2E9DF)}
    .inkfill{fill:var(--paper-ink,#180E1F)}
    .ok{fill:none;stroke:var(--draft,#2F5D8A);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .num{font:600 13px/1 'Hanken Grotesk',system-ui,sans-serif;fill:var(--paper,#F2E9DF)}
    .slot{font:500 11px/1 'B612 Mono',ui-monospace,monospace;fill:var(--paper-ink,#180E1F)}
    .slot-s{font:500 9px/1 'B612 Mono',ui-monospace,monospace;fill:var(--paper-soft,#5A4F5C)}
  </style>
  <g class="step" id="step-1" data-step="1" transform="translate(8 8)">
    <rect class="hair" x="0" y="0" width="200" height="200" rx="14"/>
    <rect class="hair" x="20" y="44" width="160" height="136" rx="2"/>
    <path class="tint" d="M70 92c10-8 40-10 56-2 8 4 6 24-4 30-14 8-42 8-54-2-8-8-6-20 2-26Z"/><path class="ink" d="M70 92c10-8 40-10 56-2 8 4 6 24-4 30-14 8-42 8-54-2-8-8-6-20 2-26Z"/>
    <path class="dim draw" pathLength="1" d="M60 142c20 18 64 18 84-4M140 140l4-2 0 6"/>
    <path class="draft" d="M152 70l4-8M160 78l8-2M146 64l0-8"/>
    <circle class="inkfill" cx="22" cy="22" r="12"/><text class="num" x="22" y="26.5" text-anchor="middle">1</text>
  </g>
  <g class="step" id="step-2" data-step="2" transform="translate(224 8)">
    <rect class="hair" x="0" y="0" width="200" height="200" rx="14"/>
    <path class="ink" d="M46 24V188"/><path class="hatch" d="M46 30l-12 12M46 48l-12 12M46 66l-12 12M46 84l-12 12M46 102l-12 12M46 120l-12 12M46 138l-12 12M46 156l-12 12M46 174l-12 12"/>
    <rect class="ink" x="47" y="70" width="6" height="18" rx="1"/><rect class="ink" x="47" y="114" width="6" height="18" rx="1"/>
    <g class="drop"><path class="acrylic" d="M53 50h8v100h-8Z"/>
    <path class="dim" d="M108 100H74M84 94l-10 6 10 6"/></g>
    <circle class="inkfill" cx="22" cy="22" r="12"/><text class="num" x="22" y="26.5" text-anchor="middle">2</text>
  </g>
  <g class="step" id="step-3" data-step="3" transform="translate(440 8)">
    <rect class="hair" x="0" y="0" width="200" height="200" rx="14"/>
    <circle class="ink" cx="100" cy="108" r="50"/><path class="hair" d="M100 58v6M150 108h-6M100 158v-6M50 108h6"/><path class="tube draw" pathLength="1" d="M100 68A40 40 0 0 1 134.6 88.0" stroke-width="4"/><path class="ink" d="M100 108V72M100 108l27.7 -16.0"/><circle class="inkfill" cx="100" cy="108" r="3"/>
    <circle class="inkfill" cx="22" cy="22" r="12"/><text class="num" x="22" y="26.5" text-anchor="middle">3</text>
  </g>
  <g class="step" id="step-4" data-step="4" transform="translate(656 8)">
    <rect class="hair" x="0" y="0" width="200" height="200" rx="14"/>
    <rect class="hair" x="20" y="44" width="160" height="136" rx="2"/>
    <path class="acrylic" d="M100.0 172.9C60.1 144.8 31.5 120.3 36.6 89.6 41.7 61.0 80.6 54.9 100.0 84.5 119.4 54.9 158.3 61.0 163.4 89.6 168.5 120.3 139.9 144.8 100.0 172.9Z"/><path class="glow" d="M100.0 153.4C71.9 133.6 51.8 116.3 55.4 94.7 59.0 74.6 86.3 70.2 100.0 91.1 113.7 70.2 141.0 74.6 144.6 94.7 148.2 116.3 128.1 133.6 100.0 153.4Z" stroke-width="18"/><path class="tube" d="M100.0 153.4C71.9 133.6 51.8 116.3 55.4 94.7 59.0 74.6 86.3 70.2 100.0 91.1 113.7 70.2 141.0 74.6 144.6 94.7 148.2 116.3 128.1 133.6 100.0 153.4Z"/>
    <circle class="paperfill" cx="166" cy="54" r="15"/><circle class="ok" cx="166" cy="54" r="15"/><path class="ok draw" pathLength="1" d="M159 54l5 5 9-10"/>
    <circle class="inkfill" cx="22" cy="22" r="12"/><text class="num" x="22" y="26.5" text-anchor="middle">4</text>
  </g>
</svg>
