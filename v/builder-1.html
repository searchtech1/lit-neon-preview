<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Design your sign · version 1 | Lit Neon</title>
<meta name="description" content="Built round, builder 1 of 2: pinned stage and four steps in place. Type your words, see them lit in a real room at true size, with the price always on screen.">
<meta name="theme-color" content="#180E1F">
<link rel="icon" href="/lit-neon-preview/assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/lit-neon-preview/assets/fonts/neonderthaw-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/lit-neon-preview/assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/lit-neon-preview/assets/fonts/big-shoulders-display-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/lit-neon-preview/assets/fonts/fonts.css">
<link rel="stylesheet" href="/lit-neon-preview/assets/css/tokens.css">
<link rel="stylesheet" href="/lit-neon-preview/assets/css/base.css">
<link rel="stylesheet" href="/lit-neon-preview/v/builder-shared.css">
<link rel="stylesheet" href="/lit-neon-preview/v/builder-1.css">
<script src="/lit-neon-preview/assets/js/core/boot.js"></script>
<link rel="modulepreload" href="/lit-neon-preview/v/builder-core.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/renderer.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/vendor/engines/catalog.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/vendor/engines/neon-core.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/vendor/engines/rules.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/stage.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/money.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/clock.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/pricing.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/router.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/facts.js">
<link rel="modulepreload" href="/lit-neon-preview/assets/js/core/copy.js">
</head>
<body data-page="builder">
<div class="v-shell v1" id="shell">
  <header class="v-hdr">
    <a class="v-hdr__back" href="/lit-neon-preview/index.html" aria-label="Back to Lit Neon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a class="v-hdr__brand" href="/lit-neon-preview/index.html">Lit Neon</a>
    <span class="v-pill" data-pill><a href="/lit-neon-preview/v/index.html">Version 1 of 2 · switch</a><button type="button" aria-label="Hide this" data-pill-x><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>
    <a class="v-hdr__basket" href="/lit-neon-preview/basket.html" aria-label="Basket"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h2l2.4 11h11.2L21 8H7M9 20h.01M17 20h.01"/></svg><b data-basket-count hidden>0</b></a>
  </header>

  <!-- pinned stage: the baked poster (night plate + lit default words) paints first; the live stage cross-fades in under it -->
  <div class="v-stagewrap" id="stagewrap" aria-label="Preview of your sign on the wall" style="--pl:-35.04%;--pt:-15.45%;--pw:169.31%;--ph:118.86%;--sx:49.92%;--sy:40.12%;--sem:10.4">
    <div class="v-poster" aria-hidden="true">
      <picture><source type="image/avif" srcset="/lit-neon-preview/assets/img/scenes/s01-living/night-wall-1000.avif 1000w, /lit-neon-preview/assets/img/scenes/s01-living/night-wall-1600.avif 1600w" sizes="150vw"><source type="image/webp" srcset="/lit-neon-preview/assets/img/scenes/s01-living/night-wall-1000.webp 1000w, /lit-neon-preview/assets/img/scenes/s01-living/night-wall-1600.webp 1600w" sizes="150vw"><img src="/lit-neon-preview/assets/img/scenes/s01-living/night-wall-1000.jpg" srcset="/lit-neon-preview/assets/img/scenes/s01-living/night-wall-1000.jpg 1000w, /lit-neon-preview/assets/img/scenes/s01-living/night-wall-1600.jpg 1600w" sizes="150vw" width="1500" height="1000" alt="" fetchpriority="high" decoding="async"></picture>
      <p class="v-poster__sign" data-poster-text style="--v-core:#ffc9ea;--v-glow-full:0 0 .02em #ffc9ea,0 0 .05em #ff3db4,0 0 .11em #ff3db4,0 0 .24em #ff3db4,0 0 .5em rgba(255,61,180,.75),0 0 1em rgba(255,61,180,.45)">After dark</p>
    </div>
    <script>/* a saved design or ?t= words: the poster shows them, in their colour, before any module runs (hidden for another face) */(function(){try{var p=document.querySelector('[data-poster-text]');var q=new URLSearchParams(location.search);var t=q.get('t')||q.get('text')||'';var rec=null;if(!/(^|&)d=/.test(location.hash.slice(1))){rec=JSON.parse(localStorage.getItem('design')||'null');if(!(rec&&rec.state&&Date.now()-(rec.updatedAt||0)<18e5))rec=null;}else{p.hidden=true;return;}var st=rec&&rec.state||{};if(st.font&&st.font!=='soho'){p.hidden=true;return;}t=t||st.text||'';if(t)p.textContent=t.slice(0,80);var H={warm:'#ffc77a',ice:'#4fd2ff',blue:'#2f6bff',violet:'#9b4dff',pink:'#ff3db4',candy:'#ff8ccf',red:'#ff2b3d',orange:'#ff7a1a',yellow:'#ffc23a',green:'#2dff7a',rgb:'#ff5fa2'};var h=H[st.colour]||'#ff3db4';if(h!=='#ff3db4'){var n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;var m=function(v){return Math.round(v+(255-v)*.72)};var core='rgb('+m(r)+','+m(g)+','+m(b)+')';var a=function(o){return 'rgba('+r+','+g+','+b+','+o+')'};p.style.setProperty('--v-core',core);p.style.setProperty('--v-glow-full','0 0 .02em '+core+',0 0 .05em '+h+',0 0 .11em '+h+',0 0 .24em '+h+',0 0 .5em '+a(.75)+',0 0 1em '+a(.45));}}catch(e){}})();</script>
    <div class="v-stage" data-stage></div>
  </div>

  <!-- the four steps, all visible at 390 -->
  <nav class="v-steps" role="tablist" aria-label="Design steps">
    <button type="button" role="tab" data-step="words" aria-selected="true" aria-controls="step-words">Words</button>
    <button type="button" role="tab" data-step="style" aria-selected="false" aria-controls="step-style">Style</button>
    <button type="button" role="tab" data-step="colour" aria-selected="false" aria-controls="step-colour">Colour</button>
    <button type="button" role="tab" data-step="size" aria-selected="false" aria-controls="step-size">Size</button>
  </nav>

  <div class="v-panel" id="panel">
    <section class="v-step" id="step-words" data-step="words" role="tabpanel">
      <div class="v-field"><label class="v-label" for="v-words">What should it say?<span class="v-label__sub">Up to 3 lines of 24 characters</span></label>
        <div class="v-words"><textarea class="v-input" id="v-words" rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="After dark" aria-describedby="v-words-note" data-qa="v.words"></textarea><button type="button" class="v-words__clear" data-clear hidden aria-label="Clear the words"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div class="v-words__meta"><span class="v-counters" aria-live="polite"></span><span class="v-note" id="v-words-note" hidden role="status"></span></div></div>
      <div class="v-rowchips">
        <button type="button" class="v-chip" data-open="symbol" data-qa="v.words.symbol"><span class="v-chip__plus">+</span><span data-symbol-label>Add a symbol</span></button>
        <a class="v-chip v-chip--ghost" href="/lit-neon-preview/upload.html?from=builder" data-qa="v.words.logo">Have a logo?</a>
      </div>
      <p class="v-lede v-step__hint">Every sign is centred and drawn in one piece of tube. You approve a drawing before anything is made.</p>
    </section>
    <section class="v-step" id="step-style" data-step="style" role="tabpanel" hidden></section>
    <section class="v-step" id="step-colour" data-step="colour" role="tabpanel" hidden></section>
    <section class="v-step" id="step-size" data-step="size" role="tabpanel" hidden></section>
  </div>

  <div class="v-dock" data-qa="v.dock">
    <button type="button" class="v-price" data-price aria-haspopup="dialog" aria-label="Price breakdown"><span class="v-price__amount" data-amount><span class="v-skel v-skel--price"></span></span><span class="v-price__cap" data-cap>Measuring your lettering…</span><span class="v-price__delta" data-delta></span></button>
    <button type="button" class="v-btn v-btn--primary v-dock__cta" data-cta>Next: Style</button>
  </div>
</div>
<script type="module" src="/lit-neon-preview/v/builder-1.js"></script>
</body>
</html>
