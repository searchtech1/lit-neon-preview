<body data-page="basket" class="bk">
<div id="chrome-top"></div>
<main id="main">
  <section class="bk-head" data-hero aria-labelledby="bk-h1">
    <div class="wrap">
      <ol class="bk-progress" aria-label="Checkout progress" data-qa="basket.page.progress">
        <li class="is-current" aria-current="step"><span class="dot">1</span><span data-copy="progress.basket">Basket</span></li>
        <li><span class="dot">2</span><span data-copy="progress.checkout">Checkout</span></li>
        <li><span class="dot">3</span><span data-copy="progress.drawing">Your drawing</span></li>
      </ol>
      <div class="bk-head__row">
        <div>
          <p class="t-eyebrow" data-copy="eyebrow">Nearly yours</p>
          <h1 id="bk-h1" class="t-display-2 bk-h1"><span data-copy="h1">Your basket</span> <span class="bk-count" data-qa="basket.page.count"></span></h1>
        </div>
        <a class="c-btn c-btn--text bk-continue" href="/lit-neon-preview/rework/shop.html" data-qa="basket.page.continue"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"></use></svg><span class="label" data-copy="continue">Continue shopping</span></a>
      </div>
    </div>
  </section>

  <section class="bk-body" aria-label="Basket">
    <div class="wrap bk-grid" id="bk-grid">
      <div class="bk-lines" id="bk-lines" data-qa="basket.page.lines" aria-live="polite">
        <div class="c-skel c-skel--card bk-skel" aria-hidden="true"></div>
      </div>
      <aside class="bk-summary" id="bk-summary" data-qa="basket.page.summary" aria-labelledby="bk-sum-h" hidden>
        <div class="bk-summary__card">
          <h2 id="bk-sum-h" class="t-title" data-copy="summary.title">Order summary</h2>
          <div class="bk-sum" id="bk-sum"></div>
        </div>
      </aside>
    </div>
  </section>

  <section class="bk-next night" aria-labelledby="bk-next-h" id="bk-next" hidden>
    <div class="wrap">
      <p class="t-eyebrow" data-copy="next.eyebrow">After you order</p>
      <h2 id="bk-next-h" class="t-display-2 bk-next__h" data-copy="next.title">What happens next</h2>
      <ol class="bk-next__steps" id="bk-next-steps" data-qa="basket.page.next"></ol>
    </div>
  </section>
</main>
<div class="bk-bar" id="bk-bar" data-qa="basket.page.bar" hidden>
  <div class="bk-bar__price"><span class="bk-bar__label" data-copy="summary.subtotal">Subtotal</span><b data-qa="basket.page.bar.total"></b></div>
  <a class="c-btn c-btn--primary" href="/lit-neon-preview/rework/checkout.html" data-qa="basket.page.bar.checkout"><span data-copy="bar.checkout">Checkout</span><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"></use></svg></a>
</div>
<div id="chrome-footer"></div>
<script type="module" src="/lit-neon-preview/rework/assets/js/pages/basket-page.js"></script>
